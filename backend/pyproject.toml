[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "polars>=1.43.2",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
# Narrow temporary suppression for Starlette 0.40+ deprecation warning in FastAPI TestClient
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

